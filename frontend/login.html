
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | CampusCare</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">✦ CampusCare</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="register.html">Create Account</a>
      <a href="admin-login.html">Admin Login</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="feature-icon">🎓</div>
      <span class="badge">STUDENT PORTAL</span>
      <h1 style="margin-top:16px">Welcome back!</h1>
      <p>Sign in to report campus issues and track your complaints.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            name="email"
            type="email"
            placeholder="you@college.edu"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="loginMessage" class="message" role="status" hidden></p>

        <button type="submit">Sign In →</button>
      </form>

      <div class="form-footer">
        Don't have an account?
        <a href="register.html">Create one</a>
      </div>

      <div class="form-footer">
        Are you an administrator?
        <a href="admin-login.html">Admin login</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    CampusCare · Your Voice Matters.
  </footer>
</body>
</html>
