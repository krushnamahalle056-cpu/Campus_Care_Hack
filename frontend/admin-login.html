
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | CampusCare</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">✦ CampusCare</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Student Login</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="feature-icon">🛡️</div>
      <span class="badge">ADMINISTRATION PORTAL</span>
      <h1 style="margin-top:16px">Admin sign in</h1>
      <p>Access the complaint management dashboard.</p>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <input
            id="adminEmail"
            name="email"
            type="email"
            placeholder="admin@campuscare.com"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input
            id="adminPassword"
            name="password"
            type="password"
            placeholder="Enter admin password"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="adminLoginMessage" class="message" role="status" hidden></p>

        <button type="submit">Access Admin Dashboard →</button>
      </form>

      <div class="form-footer">
        <a href="index.html">← Back to home</a>
      </div>

      <p style="font-size:12px;color:#718096;text-align:center;margin-top:20px">
        Restricted access · Authorized administrators only
      </p>
    </section>
  </main>

  <footer class="footer">
    CampusCare · Administration Portal
  </footer>
</body>
</html>
