
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | CampusCare</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">✦ CampusCare</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Student Login</a>
      <a href="admin-login.html">Admin</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="feature-icon">🚀</div>
      <span class="badge">JOIN CAMPUSCARE</span>
      <h1 style="margin-top:16px">Create your account</h1>
      <p>Join your campus community and help make a difference.</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input
            id="registerName"
            name="name"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
            minlength="2"
            maxlength="80"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input
            id="registerEmail"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPassword">Create Password</label>
          <input
            id="registerPassword"
            name="password"
            type="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <small style="display:block;color:#718096;margin-top:6px">
            Use at least 8 characters.
          </small>
        </div>

        <p id="registerMessage" class="message" role="status" hidden></p>

        <button type="submit">Create Account →</button>
      </form>

      <div class="form-footer">
        Already registered?
        <a href="login.html">Sign in</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    CampusCare · A better campus starts with you.
  </footer>
</body>
</html>
